name: Swift Labs

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test shared lab solutions
        run: swift test

      - name: Compile standalone labs
        shell: bash
        run: |
          while IFS= read -r source; do
            output="${RUNNER_TEMP}/$(echo "$source" | tr '/ ' '--')"
            swiftc "$source" -o "$output"
          done < <(find Labs -name main.swift -print | sort)

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Select iPhone simulator
        shell: bash
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | \
            jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))] | first | .udid')
          test -n "$SIMULATOR_ID"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Test Little Lemon app
        run: |
          xcodebuild -project LittleLemonMenu.xcodeproj \
            -scheme LittleLemonMenu \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO test

      - name: Build and capture Little Lemon app
        shell: bash
        run: |
          xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild -project LittleLemonMenu.xcodeproj \
            -scheme LittleLemonMenu \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO build
          APP_PATH="DerivedData/Build/Products/Debug-iphonesimulator/LittleLemonMenu.app"
          test -d "$APP_PATH"
          xcrun simctl install "$SIMULATOR_ID" "$APP_PATH"
          xcrun simctl launch "$SIMULATOR_ID" com.schwartzlizer.LittleLemonMenu
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot little-lemon-menu.png

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: little-lemon-menu-screenshot
          path: little-lemon-menu.png
          if-no-files-found: error
          retention-days: 14
